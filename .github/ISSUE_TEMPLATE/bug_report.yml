name: Bug report
description: Report an issue with the prompt architecture or repository documentation
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please avoid including secrets or real candidate information in your report.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly.
      placeholder: Tell us what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the relevant prompt, input, or documentation path. Redact private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
