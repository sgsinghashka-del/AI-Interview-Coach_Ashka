<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">AI Interview Coach product preview</title>
  <desc id="desc">A dark interview coaching dashboard with an interviewer persona, adaptive question, candidate response, and evaluation score cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10182b"/>
      <stop offset="1" stop-color="#172b47"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1440" height="820" rx="28" fill="#0b1120"/>
  <rect x="28" y="28" width="1384" height="764" rx="20" fill="url(#bg)" stroke="#2a3c5b"/>
  <rect x="28" y="28" width="1384" height="72" rx="20" fill="#111d33"/>
  <circle cx="64" cy="64" r="8" fill="#fb7185"/><circle cx="92" cy="64" r="8" fill="#fbbf24"/><circle cx="120" cy="64" r="8" fill="#34d399"/>
  <text x="164" y="70" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24" font-weight="700">AI Interview Coach</text>
  <text x="1180" y="69" fill="#9fb1ca" font-family="Arial, sans-serif" font-size="17">Session 04 · 18:42</text>
  <rect x="64" y="132" width="360" height="608" rx="16" fill="#111d33" stroke="#2a3c5b"/>
  <text x="94" y="177" fill="#8fa6c5" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">INTERVIEWER MODE</text>
  <text x="94" y="220" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">Product Leadership</text>
  <rect x="94" y="250" width="300" height="2" fill="#2a3c5b"/>
  <circle cx="128" cy="310" r="30" fill="#7c5cff" opacity=".25"/><circle cx="128" cy="310" r="15" fill="#7c5cff"/>
  <text x="177" y="305" fill="#f8fafc" font-family="Arial, sans-serif" font-size="20" font-weight="700">Alex Morgan</text>
  <text x="177" y="331" fill="#8fa6c5" font-family="Arial, sans-serif" font-size="15">Senior interviewer</text>
  <text x="94" y="394" fill="#8fa6c5" font-family="Arial, sans-serif" font-size="15">SESSION SIGNALS</text>
  <text x="94" y="438" fill="#f8fafc" font-family="Arial, sans-serif" font-size="17">Pressure level</text><text x="335" y="438" fill="#2dd4bf" font-family="Arial, sans-serif" font-size="17" text-anchor="end">High</text>
  <rect x="94" y="454" width="300" height="8" rx="4" fill="#263953"/><rect x="94" y="454" width="222" height="8" rx="4" fill="url(#accent)"/>
  <text x="94" y="510" fill="#f8fafc" font-family="Arial, sans-serif" font-size="17">Follow-ups asked</text><text x="335" y="510" fill="#f8fafc" font-family="Arial, sans-serif" font-size="17" text-anchor="end">06</text>
  <text x="94" y="562" fill="#f8fafc" font-family="Arial, sans-serif" font-size="17">Current round</text><text x="335" y="562" fill="#f8fafc" font-family="Arial, sans-serif" font-size="17" text-anchor="end">03 / 05</text>
  <rect x="94" y="620" width="300" height="74" rx="12" fill="#192945"/><text x="116" y="650" fill="#8fa6c5" font-family="Arial, sans-serif" font-size="14">COACHING MODE</text><text x="116" y="677" fill="#f8fafc" font-family="Arial, sans-serif" font-size="17" font-weight="700">Adaptive follow-up enabled</text>
  <rect x="452" y="132" width="926" height="290" rx="16" fill="#111d33" stroke="#2a3c5b"/>
  <text x="486" y="177" fill="#8fa6c5" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">ADAPTIVE QUESTION</text>
  <text x="486" y="232" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">Tell me about a product decision you changed</text>
  <text x="486" y="270" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">after receiving unexpected customer evidence.</text>
  <rect x="486" y="305" width="120" height="34" rx="17" fill="#263858"/><text x="546" y="328" fill="#a9bbd5" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Probe depth: 3</text>
  <text x="486" y="384" fill="#8fa6c5" font-family="Arial, sans-serif" font-size="16">Follow-up focus: evidence quality · trade-offs · ownership</text>
  <rect x="452" y="452" width="600" height="288" rx="16" fill="#111d33" stroke="#2a3c5b"/>
  <text x="486" y="497" fill="#8fa6c5" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">CANDIDATE RESPONSE</text>
  <text x="486" y="545" fill="#dce7f5" font-family="Arial, sans-serif" font-size="18">“We noticed activation was lower than expected, so I</text>
  <text x="486" y="578" fill="#dce7f5" font-family="Arial, sans-serif" font-size="18">partnered with research to segment the feedback. The</text>
  <text x="486" y="611" fill="#dce7f5" font-family="Arial, sans-serif" font-size="18">evidence showed the issue was onboarding clarity—not</text>
  <text x="486" y="644" fill="#dce7f5" font-family="Arial, sans-serif" font-size="18">the feature set—so we changed the first-run flow.”</text>
  <rect x="486" y="682" width="172" height="34" rx="17" fill="#143d45"/><text x="572" y="705" fill="#5eead4" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Response captured</text>
  <rect x="1080" y="452" width="298" height="288" rx="16" fill="#111d33" stroke="#2a3c5b"/>
  <text x="1112" y="497" fill="#8fa6c5" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">LIVE EVALUATION</text>
  <text x="1112" y="583" fill="#f8fafc" font-family="Arial, sans-serif" font-size="68" font-weight="700">8.4</text><text x="1250" y="582" fill="#8fa6c5" font-family="Arial, sans-serif" font-size="18">/ 10</text>
  <rect x="1112" y="610" width="234" height="1" fill="#2a3c5b"/>
  <text x="1112" y="650" fill="#8fa6c5" font-family="Arial, sans-serif" font-size="15">Clarity</text><text x="1328" y="650" fill="#5eead4" font-family="Arial, sans-serif" font-size="15" text-anchor="end">9.0</text>
  <text x="1112" y="682" fill="#8fa6c5" font-family="Arial, sans-serif" font-size="15">Decision quality</text><text x="1328" y="682" fill="#5eead4" font-family="Arial, sans-serif" font-size="15" text-anchor="end">8.2</text>
  <text x="1112" y="714" fill="#8fa6c5" font-family="Arial, sans-serif" font-size="15">Evidence strength</text><text x="1328" y="714" fill="#fbbf24" font-family="Arial, sans-serif" font-size="15" text-anchor="end">7.8</text>
</svg>
